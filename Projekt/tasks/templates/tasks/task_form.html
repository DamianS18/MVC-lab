{% extends "tasks/base.html" %}

{% block title %}Formularz wydarzenia{% endblock %}

{% block content %}
<section class="page-shell">
<h2>{% if object %}Edytuj wydarzenie{% else %}Dodaj wydarzenie{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="actions">
        <button type="submit">Zapisz</button>
        <a href="{% url 'tasks:list' %}">Anuluj</a>
    </div>
</form>
</section>
{% endblock %}
